<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thyme.org">

<head>
    <meta charset="UTF-8">

    <title
        th:text="${mode == 'edit'} ? 'リスト名変更' : 'リスト作成'"
    >
        リスト
    </title>
</head>

<body>

<h1
    th:text="${mode == 'edit'} ? 'リスト名変更' : 'リスト作成'"
>
    リスト
</h1>

<form
    th:action="${mode == 'edit'} ? @{/lists/update} : @{/lists/create}"
    method="post"
>
    <input
        type="hidden"
        name="_csrf"
        th:value="${csrfToken}"
    >

    <input
        th:if="${mode == 'edit'}"
        type="hidden"
        name="id"
        th:value="${listId}"
    >

    <div>
        <label for="listName">
            リスト名
        </label>

        <input
            id="listName"
            name="listName"
            type="text"
            maxlength="100"
            required
            th:value="${listName}"
        >

        <p
            th:if="${errors != null and errors.containsKey('listName')}"
            th:text="${errors['listName']}"
        >
            エラー
        </p>
    </div>

    <button type="submit">
        保存
    </button>
</form>

<p>
    <a th:href="@{/lists}">
        リスト一覧へ戻る
    </a>
</p>

</body>
</html>
