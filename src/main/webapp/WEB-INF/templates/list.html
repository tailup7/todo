<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>リスト | Todo</title>

    <style>
        :root {
            color: #1f2937;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                    "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: #f3f6fb;
            margin: 0;
            min-height: 100vh;
            padding: 24px;
        }

        .page {
            margin: 0 auto;
            max-width: 800px;
        }

        .page-header {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 1.75rem;
            margin: 0;
        }

        .logout-form {
            margin: 0;
        }

        .logout-button {
            background: #ffffff;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            color: #334155;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            padding: 10px 16px;
        }

        .logout-button:hover {
            background: #f8fafc;
        }

        .lead {
            color: #64748b;
            margin: 0 0 16px;
        }

        .list-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .list-card {
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(31, 41, 55, 0.07);
            color: inherit;
            display: block;
            padding: 24px;
            text-decoration: none;
            transition: box-shadow 0.15s ease, transform 0.15s ease;
        }

        .list-card:hover {
            box-shadow: 0 8px 20px rgba(31, 41, 55, 0.12);
            transform: translateY(-2px);
        }

        .list-card h2 {
            font-size: 1.15rem;
            margin: 0;
        }

        .list-card p {
            color: #64748b;
            font-size: 0.9rem;
            margin: 8px 0 0;
        }
    </style>
</head>

<body>

<main class="page">
    <header class="page-header">
        <h1>リスト</h1>
    <!--
        ブラウザからPOSTメソッドを送るとき(ユーザが何かしらボタンなどを押してサーバに情報を送るとき)、
        必ず送信先となるURLが必要。そのURLは、必ずしも画面として実装されていなくても良い。
        ここでは、ログアウトボタンを押したときにPOSTメソッドで送信するURLとして、/logout を指定している。
    -->
        <form class="logout-form" th:action="@{/logout}" method="post">
            <input
                type="hidden"
                name="_csrf"
                th:value="${csrfToken}"
            >
    
            <button class="logout-button" type="submit">
                ログアウト
            </button>
        </form>
    </header>

    <p
        class="lead"
        th:if="${#lists.isEmpty(todoLists)}"
    >
        リストはまだありません。
    </p>

    <section
        class="list-grid"
        aria-label="Todo リスト"
        th:if="${!#lists.isEmpty(todoLists)}"
    >
        <a
            class="list-card"
            th:each="todoList : ${todoLists}"
            th:href="@{/todos}"
        >
            <h2 th:text="${todoList.listName}">
                リスト名
            </h2>

            <p>Todo を確認・編集する</p>
        </a>
    </section>
</main>

</body>
</html>
