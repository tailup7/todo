<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title
        th:text="${mode == 'edit'} ? 'Todo編集' : 'Todo追加'"
    >
        Todo
    </title>
</head>

<body>

<h1 th:text="${mode == 'edit'} ? 'Todo編集' : 'Todo追加'">
    Todo
</h1>

<form
    th:action="${mode == 'edit'} ? @{/todos/update} : @{/todos/create}"
    method="post"
>
    <input
        type="hidden"
        name="_csrf"
        th:value="${csrfToken}"
    >

    <!-- 作成・編集後に、どのリストへ戻るかを維持する -->
    <input
        type="hidden"
        name="listId"
        th:value="${todo.listId}"
    >

    <input
        th:if="${mode == 'edit'}"
        type="hidden"
        name="id"
        th:value="${todo.id}"
    >

    <div>
        <label for="title">タイトル</label>

        <input
            id="title"
            name="title"
            type="text"
            maxlength="200"
            required
            th:value="${todo.title}"
        >

        <p
            th:if="${errors != null and errors.containsKey('title')}"
            th:text="${errors['title']}"
        >
            エラーメッセージ
        </p>
    </div>

    <div>
        <label for="description">説明</label>

        <textarea
            id="description"
            name="description"
            maxlength="2000"
            th:text="${todo.description}"
        ></textarea>

        <p
            th:if="${errors != null and errors.containsKey('description')}"
            th:text="${errors['description']}"
        >
            エラーメッセージ
        </p>
    </div>

    <div>
        <label for="status">状態</label>

        <select
            id="status"
            name="status"
            required
        >
            <option
                th:each="status : ${statuses}"
                th:value="${status.name()}"
                th:text="${status.label}"
                th:selected="${status == todo.status}"
            >
                未開始
            </option>
        </select>

        <p
            th:if="${errors != null and errors.containsKey('status')}"
            th:text="${errors['status']}"
        >
            エラーメッセージ
        </p>
    </div>

    <button type="submit">
        保存
    </button>
</form>

<p>
    <a th:href="@{/todos(listId=${todo.listId})}">
        一覧へ戻る
    </a>
</p>

</body>
</html>
